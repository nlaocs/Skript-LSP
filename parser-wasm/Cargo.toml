[package]
name = "parser-wasm"
version = "0.1.0"
edition = "2024"

[features]
default = ["host"]
host = ["dep:directories", "dep:fancy-regex", "dep:redb", "dep:sha2", "dep:skript-parser", "dep:syntaxes", "dep:url", "dep:wasmtime"]

[dependencies]
directories = { version = "=6.0.0", optional = true }
fancy-regex = { version = "0.19.0", optional = true }
redb = { version = "=4.1.0", optional = true }
sha2 = { version = "0.10.9", optional = true }
thiserror = "2.0.17"
syntaxes = { path = "../syntaxes", optional = true }
skript-parser = { path = "../skript-parser", optional = true }
url = { version = "2.5.7", optional = true }
wasmtime = { version = "=43.0.0", default-features = false, features = ["component-model", "cranelift", "runtime", "std"], optional = true }

[dev-dependencies]
ssg = { path = "../ssg" }
syntax-pattern-parser = { path = "../syntax-pattern-parser" }
tempfile = "3.25.0"
wasm-encoder = "=0.245.1"
wit-bindgen = "0.59.0"
wit-parser = { version = "=0.253.0", default-features = false, features = ["std"] }

[package.metadata.component]
package = "nlaocs:skript-parser-addon"
