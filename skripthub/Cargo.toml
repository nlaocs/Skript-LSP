[package]
name = "skripthub"
version = "0.1.0"
edition = "2024"

[dependencies]
serde = { version = "1.0.228", features = ["derive"] }
serde-intern = "1.0.0"
serde_json = "1.0.145"
syntax-pattern-parser = { path = "../syntax-pattern-parser" }
thiserror = "2.0.17"
time = { version = "0.3.41", features = ["serde", "parsing", "macros"] }
ureq = { version = "3.1", features = ["json"] }